<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">変数つきルール・ラボの紹介</title>
  <desc id="desc">1つのルールに呼び出すたびに異なるxとyを渡して3つの形を描く教材</desc>
  <defs>
    <pattern id="paper" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#f7fcff"/>
      <path d="M32 0H0V32" fill="none" stroke="#d9edf8" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#345b7c" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#paper)"/>
  <rect x="24" y="22" width="1552" height="96" rx="24" fill="#fff" stroke="#70b9e5" stroke-width="5"/>
  <circle cx="80" cy="70" r="34" fill="#268bdc"/>
  <text x="80" y="82" text-anchor="middle" font-size="34" font-weight="900" fill="#fff">1</text>
  <text x="132" y="70" font-size="39" font-weight="900" fill="#0d2a63">変数つきルール・ラボ</text>
  <text x="132" y="100" font-size="21" font-weight="800" fill="#526c8b">高学年の第1課題：値を変えて、同じルールを再利用しよう</text>
  <rect x="948" y="39" width="590" height="62" rx="20" fill="#fff3bd" stroke="#efad12" stroke-width="4"/>
  <text x="975" y="64" font-size="17" font-weight="900" fill="#a35a00">きょうのゴール</text>
  <text x="975" y="91" font-size="22" font-weight="900" fill="#0d2a63">ルール(x, y)へ毎回ちがう値を渡す</text>

  <rect x="30" y="140" width="430" height="510" rx="26" fill="#fff" stroke="#ff637c" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="75" cy="188" r="30" fill="#ff536e"/>
  <text x="75" y="200" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">1</text>
  <text x="120" y="186" font-size="29" font-weight="900" fill="#0d2a63">ルール(x, y)を作る</text>
  <text x="120" y="216" font-size="18" font-weight="800" fill="#5a718c">数字を入れず、変数を使う6枚を1つだけ</text>
  <rect x="55" y="246" width="380" height="78" rx="18" fill="#eef9ff" stroke="#7cbfe5" stroke-width="4"/>
  <text x="76" y="278" font-size="22" font-weight="900" fill="#0d2a63">再利用するルール（x, y）</text>
  <text x="76" y="306" font-size="16" font-weight="800" fill="#56708e">x＝横のマス数　y＝縦のマス数</text>
  <g font-size="17" font-weight="900" fill="#0d2a63" text-anchor="middle">
    <g transform="translate(55 350)"><rect width="178" height="70" rx="15" fill="#eef8ff" stroke="#5eb0df" stroke-width="3"/><text x="89" y="42">→ 右へ x</text></g>
    <g transform="translate(257 350)"><rect width="178" height="70" rx="15" fill="#eef8ff" stroke="#5eb0df" stroke-width="3"/><text x="89" y="42">↑ 上へ y</text></g>
    <g transform="translate(55 436)"><rect width="178" height="70" rx="15" fill="#eefbff" stroke="#39b5e0" stroke-width="3"/><text x="89" y="42">■ 青でぬる</text></g>
    <g transform="translate(257 436)"><rect width="178" height="70" rx="15" fill="#eef8ff" stroke="#5eb0df" stroke-width="3"/><text x="89" y="42">→ 右へ x</text></g>
    <g transform="translate(55 522)"><rect width="178" height="70" rx="15" fill="#eef8ff" stroke="#5eb0df" stroke-width="3"/><text x="89" y="42">↓ 下へ y</text></g>
    <g transform="translate(257 522)"><rect width="178" height="70" rx="15" fill="#fff9df" stroke="#efae21" stroke-width="3"/><text x="89" y="42">■ 黄でぬる</text></g>
  </g>
  <text x="245" y="628" text-anchor="middle" font-size="18" font-weight="900" fill="#ef4058">6枚をコピーしない</text>

  <rect x="486" y="140" width="1084" height="510" rx="26" fill="#fff" stroke="#ff637c" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="532" cy="188" r="30" fill="#ff536e"/>
  <text x="532" y="200" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">2</text>
  <text x="578" y="188" font-size="30" font-weight="900" fill="#0d2a63">3つの呼び出しを見くらべる</text>
  <text x="578" y="218" font-size="18" font-weight="800" fill="#5a718c">白い①②③の形に合うx・yを考えよう</text>
  <rect x="512" y="242" width="1032" height="382" rx="20" fill="#f8fcff" stroke="#78bee7" stroke-width="4"/>
  <g stroke="#afd8ee" stroke-width="2">
    <path d="M548 270V594M606 270V594M664 270V594M722 270V594M780 270V594M838 270V594M896 270V594M954 270V594M1012 270V594M1070 270V594M1128 270V594M1186 270V594M1244 270V594M1302 270V594M1360 270V594M1418 270V594M1476 270V594"/>
    <path d="M536 276H1512M536 330H1512M536 384H1512M536 438H1512M536 492H1512M536 546H1512M536 600H1512"/>
  </g>
  <g fill="#718399"><rect x="700" y="526" width="46" height="42" rx="7"/><rect x="990" y="526" width="46" height="42" rx="7"/><rect x="1338" y="526" width="46" height="42" rx="7"/></g>
  <path d="M558 546H674V438H790V546H964V492H1138V546H1312V384H1486V546" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M558 546H674V438H790V546H964V492H1138V546H1312V384H1486V546" fill="none" stroke="#73839a" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-size="19" font-weight="900" fill="#0d2a63" text-anchor="middle">
    <circle cx="674" cy="414" r="19" fill="#dff5ff" stroke="#39b5e0" stroke-width="3"/><text x="674" y="421">1</text>
    <circle cx="964" cy="468" r="19" fill="#f0e8ff" stroke="#8a61ce" stroke-width="3"/><text x="964" y="475">2</text>
    <circle cx="1312" cy="360" r="19" fill="#fff0c7" stroke="#e29b14" stroke-width="3"/><text x="1312" y="367">3</text>
  </g>
  <g><rect x="657" y="421" width="34" height="34" rx="7" fill="#39b5e0"/><rect x="773" y="529" width="34" height="34" rx="7" fill="#ffcd30"/><rect x="947" y="475" width="34" height="34" rx="7" fill="#39b5e0"/><rect x="1121" y="529" width="34" height="34" rx="7" fill="#ffcd30"/><rect x="1295" y="367" width="34" height="34" rx="7" fill="#39b5e0"/><rect x="1469" y="529" width="34" height="34" rx="7" fill="#ffcd30"/></g>
  <circle cx="558" cy="546" r="27" fill="#157bc2" stroke="#fff" stroke-width="5"/><text x="558" y="555" text-anchor="middle" font-size="22" fill="#fff">🤖</text>
  <text x="1486" y="525" text-anchor="middle" font-size="34">🏁</text>

  <rect x="30" y="680" width="1540" height="188" rx="26" fill="#fff" stroke="#348fdf" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="76" cy="728" r="30" fill="#ff536e"/>
  <text x="76" y="740" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">3</text>
  <text x="120" y="731" font-size="29" font-weight="900" fill="#0d2a63">同じルールへ3組の値を渡す</text>
  <text x="120" y="759" font-size="17" font-weight="800" fill="#56708e">値は最初から入っていません。白い線を見て考えます。</text>
  <g font-size="20" font-weight="900" fill="#0d2a63">
    <g transform="translate(510 704)"><rect width="280" height="126" rx="20" fill="#eef9ff" stroke="#63b1df" stroke-width="4"/><circle cx="35" cy="35" r="22" fill="#238fe2"/><text x="35" y="43" text-anchor="middle" fill="#fff">1</text><text x="67" y="42">ルール（x=?, y=?）</text><text x="35" y="91" font-size="16" fill="#56708e">①の形に合う値</text></g>
    <g transform="translate(812 704)"><rect width="280" height="126" rx="20" fill="#faf7ff" stroke="#8a61ce" stroke-width="4"/><circle cx="35" cy="35" r="22" fill="#8255c7"/><text x="35" y="43" text-anchor="middle" fill="#fff">2</text><text x="67" y="42">ルール（x=?, y=?）</text><text x="35" y="91" font-size="16" fill="#56708e">②の形に合う値</text></g>
    <g transform="translate(1114 704)"><rect width="280" height="126" rx="20" fill="#fffaf0" stroke="#dfa028" stroke-width="4"/><circle cx="35" cy="35" r="22" fill="#d58c05"/><text x="35" y="43" text-anchor="middle" fill="#fff">3</text><text x="67" y="42">ルール（x=?, y=?）</text><text x="35" y="91" font-size="16" fill="#56708e">③の形に合う値</text></g>
  </g>
  <rect x="1418" y="704" width="128" height="126" rx="20" fill="#22a85d"/>
  <text x="1482" y="757" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">3回を</text>
  <text x="1482" y="790" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">実行</text>
</svg>
